name: SmartDevis AI - CI/CD

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:

  backend:
    name: Backend - Install and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test --if-present

  frontend:
    name: Frontend - Install and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npx nx build frontend --configuration=production --skip-nx-cache

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate Angular dist
        working-directory: frontend
        run: npx nx build frontend --configuration=production --skip-nx-cache

      - name: Build Docker images
        run: docker compose build

  docker-push:
    name: Docker Push to Docker Hub
    runs-on: ubuntu-latest

    needs:
      - docker-build

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate Angular dist
        working-directory: frontend
        run: npx nx build frontend --configuration=production --skip-nx-cache

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Backend Image
        run: |
          docker build \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/smartdevis-backend:latest \
          ./backend

      - name: Push Backend Image
        run: |
          docker push \
          ${{ secrets.DOCKERHUB_USERNAME }}/smartdevis-backend:latest

      - name: Build Frontend Image
        run: |
          docker build \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/smartdevis-frontend:latest \
          ./frontend

      - name: Push Frontend Image
        run: |
          docker push \
          ${{ secrets.DOCKERHUB_USERNAME }}/smartdevis-frontend:latest