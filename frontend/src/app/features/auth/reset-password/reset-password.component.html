<div class="reset-page">
  <div class="reset-card">
    <img
      src="assets/logo_africa_engineering.jpg"
      alt="Logo Africa Engineering"
      class="reset-logo"
    />

    <h2>Réinitialiser le mot de passe</h2>
    <p class="subtitle">Veuillez saisir votre nouveau mot de passe</p>

    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          formControlName="email"
          placeholder="Votre email"
        />

        <small
          class="field-error"
          *ngIf="resetForm.get('email')?.touched && resetForm.get('email')?.invalid"
        >
          Email invalide.
        </small>
      </div>

      <div class="form-group">
        <label>Nouveau mot de passe</label>
        <input
          type="password"
          formControlName="password"
          placeholder="Nouveau mot de passe"
        />

        <small
          class="field-error"
          *ngIf="resetForm.get('password')?.touched && resetForm.get('password')?.invalid"
        >
          Le mot de passe doit contenir au moins 6 caractères.
        </small>
      </div>

      <div class="form-group">
        <label>Confirmer le mot de passe</label>
        <input
          type="password"
          formControlName="confirmPassword"
          placeholder="Confirmer le mot de passe"
        />

        <small
          class="field-error"
          *ngIf="resetForm.get('confirmPassword')?.touched && resetForm.get('confirmPassword')?.invalid"
        >
          La confirmation est obligatoire.
        </small>
      </div>

      <button class="btn-primary" type="submit" [disabled]="loading">
        {{ loading ? 'Réinitialisation...' : 'Réinitialiser' }}
      </button>

      <button class="btn-secondary" type="button" routerLink="/login">
        Retour à la connexion
      </button>
    </form>

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
    <p class="success" *ngIf="successMessage">{{ successMessage }}</p>
  </div>
</div>
