<div class="register-wrapper">
  <div class="login-card">
    <img
      src="assets/logo_africa_engineering.jpg"
      alt="Logo Africa Engineering"
      class="login-logo"
    />

    <h2>Créer un compte</h2>
    <p class="subtitle">Inscription à SmartDevis AI</p>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Nom complet</label>
        <input
          type="text"
          formControlName="nom"
          placeholder="Votre nom complet"
        />

        <small
          class="field-error"
          *ngIf="registerForm.get('nom')?.touched && registerForm.get('nom')?.invalid"
        >
          Le nom est obligatoire.
        </small>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          formControlName="email"
          placeholder="Votre email"
        />

        <small
          class="field-error"
          *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.invalid"
        >
          Email invalide.
        </small>
      </div>

      <div class="form-group">
        <label>Mot de passe</label>
        <input
          type="password"
          formControlName="password"
          placeholder="Mot de passe"
        />

        <small
          class="field-error"
          *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.invalid"
        >
          Le mot de passe doit contenir au moins 6 caractères.
        </small>
      </div>

      <div class="form-group">
        <label>Confirmer le mot de passe</label>
        <input
          type="password"
          formControlName="confirmPassword"
          placeholder="Confirmer le mot de passe"
        />
      </div>

      <div class="form-group">
        <label>Rôle</label>
        <select formControlName="role">
  <option value="consultant">Consultant</option>
  <option value="manager">Manager</option>
  <option value="agent_saisie">Agent de saisie</option>
</select>
      </div>

      <button class="btn-primary" type="submit" [disabled]="loading">
        {{ loading ? 'Création...' : 'Créer un compte' }}
      </button>

      <button class="btn-secondary" type="button" routerLink="/login">
        Se connecter
      </button>
    </form>

<p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
<p class="success" *ngIf="successMessage">{{ successMessage }}</p>
  </div>
</div>
